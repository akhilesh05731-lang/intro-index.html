<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>बदलती नारी, नया समाज</title>

<!-- Premium Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    color:#fff;
    background:#000;
}

/* ================= MAIN ================= */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(132,92,25,.14) 0%,
            rgba(20,15,8,.45) 30%,
            #000 72%
        );
}


/* ================= GLOW ================= */

.glow{
    position:absolute;

    width:45vw;
    height:45vw;

    max-width:600px;
    max-height:600px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(218,170,66,.09),
            transparent 68%
        );

    filter:blur(15px);

    animation:pulse 5s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        transform:translate(-50%,-50%) scale(.9);
        opacity:.5;
    }

    50%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }
}


/* ================= GOLDEN RING ================= */

.ring{
    position:absolute;

    width:min(58vw,680px);
    height:min(58vw,680px);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:1px solid rgba(218,174,82,.25);

    box-shadow:
        0 0 50px rgba(218,174,82,.05);

    animation:rotate 22s linear infinite;
}

.ring::before{
    content:"";

    position:absolute;

    inset:25px;

    border-radius:50%;

    border:1px solid rgba(255,220,130,.10);
}

.ring::after{
    content:"";

    position:absolute;

    inset:-20px;

    border-radius:50%;

    border:1px dashed rgba(218,174,82,.10);
}

@keyframes rotate{

    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}


/* ================= MOVING LIGHT ================= */

.light{
    position:absolute;

    width:80vw;
    height:2px;

    left:-90%;
    top:50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,225,150,.7),
            transparent
        );

    filter:blur(5px);

    transform:rotate(-18deg);

    animation:light 8s ease-in-out infinite;
}

@keyframes light{

    0%{
        left:-90%;
        opacity:0;
    }

    20%{
        opacity:1;
    }

    55%{
        left:110%;
        opacity:1;
    }

    70%,100%{
        left:110%;
        opacity:0;
    }
}


/* ================= PARTICLES ================= */

.particles{
    position:absolute;

    width:100%;
    height:100%;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#e6c66f;

    box-shadow:
        0 0 7px rgba(230,198,111,.9),
        0 0 14px rgba(230,198,111,.4);

    animation:particleMove linear infinite;
}

@keyframes particleMove{

    from{
        transform:translateY(110vh) scale(.2);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    80%{
        opacity:.7;
    }

    to{
        transform:translateY(-10vh) scale(1);
        opacity:0;
    }
}


/* ================= CORNERS ================= */

.corner{
    position:absolute;

    width:65px;
    height:65px;

    border-color:rgba(218,174,82,.35);

    border-style:solid;
}

.tl{
    top:28px;
    left:28px;
    border-width:1px 0 0 1px;
}

.tr{
    top:28px;
    right:28px;
    border-width:1px 1px 0 0;
}

.bl{
    bottom:28px;
    left:28px;
    border-width:0 0 1px 1px;
}

.br{
    bottom:28px;
    right:28px;
    border-width:0 1px 1px 0;
}


/* ================= CONTENT ================= */

.content{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;
}

.card{
    position:absolute;

    width:92%;
    max-width:1100px;

    opacity:0;

    transform:
        translateY(40px)
        scale(.90);

    filter:blur(10px);

    transition:
        opacity 1.2s ease,
        transform 1.4s cubic-bezier(.16,1,.3,1),
        filter 1.2s ease;
}

.card.active{
    opacity:1;

    transform:
        translateY(0)
        scale(1);

    filter:blur(0);
}

.card.exit{
    opacity:0;

    transform:
        translateY(-35px)
        scale(1.06);

    filter:blur(8px);
}


/* ================= NUMBER ================= */

.number{
    font-family:'Montserrat',sans-serif;

    font-size:12px;

    letter-spacing:7px;

    color:#c9a95c;

    margin-bottom:22px;
}


/* ================= LABEL ================= */

.label{
    font-family:'Montserrat',sans-serif;

    font-size:clamp(11px,1.4vw,17px);

    letter-spacing:6px;

    color:#cbb98b;

    margin-bottom:12px;
}


/* ================= MAIN ENGLISH TITLE ================= */

.title{
    font-family:'Cinzel',serif;

    font-size:clamp(25px,5vw,66px);

    line-height:1.35;

    letter-spacing:4px;

    font-weight:600;

    text-shadow:
        0 0 18px rgba(255,215,120,.20),
        0 0 50px rgba(255,190,70,.08);
}


/* ================= HINDI TOPIC ================= */

.topic{

    font-family:'Noto Serif Devanagari',serif;

    font-size:clamp(35px,7vw,92px);

    line-height:1.45;

    font-weight:700;

    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #e5c46c,
            #fff,
            #d6ae52,
            #fff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:goldText 5s linear infinite;

    text-shadow:
        0 0 30px rgba(220,175,70,.12);
}

@keyframes goldText{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:300% center;
    }
}


/* ================= NAME ================= */

.name{

    font-family:'Cinzel',serif;

    font-size:clamp(27px,5vw,68px);

    font-weight:600;

    letter-spacing:5px;

    margin-top:12px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #d9b55e,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:nameGold 4s linear infinite;
}

@keyframes nameGold{

    to{
        background-position:200% center;
    }
}


/* ================= LINE ================= */

.line{

    width:0;

    height:1px;

    margin:28px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d9b55e,
            transparent
        );

    transition:width 1.5s ease .5s;
}

.card.active .line{
    width:min(420px,70%);
}


/* ================= FINAL ================= */

.final .label{
    letter-spacing:8px;
}

.final .name{

    font-size:clamp(40px,8vw,100px);

    font-weight:700;

    letter-spacing:8px;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .ring{
        width:105vw;
        height:105vw;
    }

    .corner{
        width:45px;
        height:45px;
    }

    .tl{
        top:18px;
        left:18px;
    }

    .tr{
        top:18px;
        right:18px;
    }

    .bl{
        bottom:18px;
        left:18px;
    }

    .br{
        bottom:18px;
        right:18px;
    }

    .title{
        letter-spacing:2px;
    }

    .name{
        letter-spacing:3px;
    }

    .topic{
        letter-spacing:0;
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="glow"></div>

    <div class="ring"></div>

    <div class="light"></div>

    <div class="particles" id="particles"></div>


    <!-- Corners -->

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>


    <div class="content">


        <!-- 01 COLLEGE -->

        <div class="card active">

            <div class="number">01</div>

            <div class="title">
                NATIONAL TEACHER'S<br>
                TRAINING COLLEGE, PATNA
            </div>

            <div class="line"></div>

        </div>


        <!-- 02 SESSION -->

        <div class="card">

            <div class="number">02</div>

            <div class="label">
                B.Ed. SESSION
            </div>

            <div class="name">
                2026 — 2027
            </div>

            <div class="line"></div>

        </div>


        <!-- 03 TOPIC -->

        <div class="card">

            <div class="number">03</div>

            <div class="label">
                TOPIC
            </div>

            <div class="topic">
                “बदलती नारी,<br>
                नया समाज”
            </div>

            <div class="line"></div>

        </div>


        <!-- 04 FOUNDER -->

        <div class="card">

            <div class="number">04</div>

            <div class="label">
                FOUNDER
            </div>

            <div class="name">
                JAHANGIR KHAN
            </div>

            <div class="line"></div>

        </div>


        <!-- 05 DIRECTOR -->

        <div class="card">

            <div class="number">05</div>

            <div class="label">
                DIRECTOR
            </div>

            <div class="name">
                ADNAN NAWAZ KHAN
            </div>

            <div class="line"></div>

        </div>


        <!-- 06 PRINCIPAL -->

        <div class="card">

            <div class="number">06</div>

            <div class="label">
                PRINCIPAL
            </div>

            <div class="name">
                DR. A.K. ROY
            </div>

            <div class="line"></div>

        </div>


        <!-- 07 PRESENTED BY -->

        <div class="card final">

            <div class="number">07</div>

            <div class="label">
                PRESENTED BY
            </div>

            <div class="name">
                ANKITA RAJ
            </div>

            <div class="line"></div>

        </div>


    </div>

</div>


<script>

/* ================= GOLD PARTICLES ================= */

const particleBox =
document.getElementById("particles");

for(let i=0; i<110; i++){

    const particle =
        document.createElement("div");

    particle.className="particle";

    particle.style.left =
        Math.random()*100 + "%";

    particle.style.animationDuration =
        (5 + Math.random()*10) + "s";

    particle.style.animationDelay =
        (-Math.random()*12) + "s";

    particle.style.opacity =
        Math.random()*.8;

    const size =
        1 + Math.random()*3;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    particleBox.appendChild(particle);
}


/* ================= SLIDE SYSTEM ================= */

const cards =
document.querySelectorAll(".card");

let current = 0;

const slideTime = 5000;


function nextSlide(){

    const oldCard =
        cards[current];

    oldCard.classList.remove("active");

    oldCard.classList.add("exit");


    current++;

    if(current >= cards.length){

        current = 0;

    }


    const newCard =
        cards[current];


    setTimeout(()=>{

        cards.forEach(card=>{
            card.classList.remove("exit");
        });

        newCard.classList.add("active");

    },350);

}


/* Automatic */

setInterval(
    nextSlide,
    slideTime
);


/* Click anywhere = next */

document.body.addEventListener(
    "click",
    nextSlide
);

</script>

</body>
</html>
